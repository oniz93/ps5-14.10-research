// (docs/65, CVE-2026-43715) needs a *three-step ordering*: a document @font-face with a client in
// the set, a sheet rebuild that frees it, and a script window inside the getter that runs the
// recalc.  i.i.d. sampling reaches orderings like that rarely — and, worse, docs/84's alphabet had
// no op that could open the window at all: `Fnew-local` uses local("NoSuchFontName"), whose source
// fails synchronously, so pump() goes Pending -> Loading -> Failure and FontFace::fontStateChanged
// *rejects* (no resolve, no `then` read).  Only a source that resolves synchronously reaches
// Status::Success, where `m_loadedPromise->resolve(*this)` runs page script inside
// iterateClients inside setStatus — the window the CVE lives in.
//
// What this instrument changes, and nothing else:
//   1. a *round* is 3-6 operations run back to back in one task, so state that a setTimeout(0)
//      would normally settle (a pending load, a queued microtask, a stale resolver) is still in
//      flight when the next op runs;
//   2. two ops are added: `Fnew-good` (a JS FontFace with a source that resolves synchronously, so
//      the window really fires inside setStatus) and `Fdoc` (the docs/65 arming sequence itself);
//   3. `gc=1` puts a collection inside the window: ~400k objects allocated in the engine's frame,
//      with WeakRef decoys created in the PREVIOUS task as the witness (docs/77/docs/78);
//   4. `cal=1` replays the docs/65 sequence verbatim, once, as the instrument's sensitivity check.
//
// Determinism: one xorshift32 word chooses how many of six slots run (3..6), then exactly four
// words per slot, always, whatever the op.  A round therefore draws 1 + 6*4 = 25 words, and the op
// id and arguments at slot s of round r are a pure function of (seed, r) — `only=`/`skip=` and the
// slot count never renumber the stream.  Beacons: `m=<round>&op=<last>` every `every=` rounds, a
// final `m=done`, and one `m=census` line per op id.
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  function K(k, d) { return Q.has(k) ? Q.get(k) : d; }
  function B(m, x) {
    try { (new Image()).src = '/ev?m=' + encodeURIComponent(String(m)) + (x ? '&' + x : ''); } catch (e) {}
  }

  var SEED  = (parseInt(K('seed', '1'), 10) >>> 0) || 1;
  var N     = Math.max(0, parseInt(K('n', '2000'), 10));       // ROUNDS, not operations
  var EVERY = Math.max(1, parseInt(K('every', '200'), 10));
  var BATCH = Math.max(1, parseInt(K('batch', '10'), 10));     // rounds per task
  var ONLY  = K('only', '') ? K('only', '').split(',') : null;
  var SKIP  = K('skip', '') ? K('skip', '').split(',') : null;
  var THEN  = K('then', '0') === '1';
  var DELF  = K('del', '0') === '1';                           // then=1 only
  var GC    = K('gc', '0') === '1';
  var GCMAX = Math.max(0, parseInt(K('gcmax', '60'), 10));     // windows that do the churn
  var CAL   = K('cal', '0') === '1';
  var DBG   = K('dbg', '0') === '1';                           // diagnostic beacons inside ops
  var MAXF  = Math.max(1, parseInt(K('maxfaces', '8'), 10));
  var MAXR  = Math.max(1, parseInt(K('maxrules', '24'), 10));
  var MAXE  = Math.max(0, parseInt(K('maxels', '40'), 10));
  var TICK  = Math.max(0, parseInt(K('tick', '5000'), 10));

  // docs/86 knobs.  One variable per arm: `ath` installs the Animation window, `ext` is the
  // destructive action the windows take on the three new surfaces (terminate the worker, remove a
  // frame).  With both off the page is the docs/85 instrument plus three new ops in the stream.
  var ATH = K('ath', '0') === '1';

  // docs/87 knob.  `mob=0` removes the MutationObserver from the page entirely, i.e. the control for
  // the one new surface whose install is a page-level object rather than a per-op call.
  var MOB = K('mob', '1') === '1';

  // xorshift32, identical to docs/84's page.  Seed 0 is remapped (the generator's fixed point).

  var root = document.getElementById('root');
  var p0 = document.getElementById('p0');
  var s0 = document.getElementById('s0');
  var live = [], probe = [], els = [], defs = [], junk = [], docEls = {}, lastDoc = null;
  var counter = 0, STAT = '', depth = 0, thenHits = 0, seq = 0, lastOp = 'none', gcHits = 0, gcAlive = '';
  var T0 = Date.now();

  function noop() {}
  function inlineSheet() { return s0 && s0.sheet ? s0.sheet : null; }

  }
  function trimRules(s) {
    try { while (s && s.cssRules && s.cssRules.length > MAXR) s.deleteRule(s.cssRules.length - 1); } catch (e) {}
  }
  function trimEls() {
    while (els.length > MAXE) { var el = els.shift(); if (el && el.parentNode) el.parentNode.removeChild(el); }
  }

  // ---------------------------------------------------------------- the alphabet (docs/84, verbatim)
  var OPS = [
    // --- font lifecycle (docs/65)
    ['Fnew-local', 6, function (a, b) {
      var f = new FontFace(fam(a), 'local("NoSuchFontName' + (b % 7) + '")');
      document.fonts.add(f);
      f.load().then(noop, noop);
      live.push(f); trimFaces();

    ['Fnew-url', 3, function (a, b) {

    ['Fload', 3, function (a) {

    }],
    ['Fstatus', 3, function (a) {

    }],
    ['Fdel', 2, function (a) {

    ['Fstyle', 5, function (a) {
      var n = 'zzS' + (a % 8);

      probe.push(el);

    }],
    ['Fready', 1, function () { document.fonts.ready.then(noop, noop); }],

    // --- CSSOM rule mutation (docs/72)
    ['Rfont', 6, function (a) {
      var s = inlineSheet(); if (!s) return;
      s.insertRule('@font-face{font-family:zzR' + (a % 16) + ';src:local("NoSuchFontName")}', 0);
      trimRules(s);
    }],
    ['Rplain', 4, function (a, b) {
      var s = inlineSheet(); if (!s) return;
      var L = s.cssRules.length;
      s.insertRule('.c' + (a % 12) + '{color:rgb(' + (b % 256) + ',0,0)}', b % (L + 1));
      trimRules(s);
    }],
    ['Rdel', 4, function (a, b, c) {
      var s = inlineSheet(); if (!s) return;
      var L = s.cssRules.length; if (!L) return;
      s.deleteRule(c % L);
    }],
    ['Rmedia', 3, function (a, b) {
      var s = inlineSheet(); if (!s) return;
      s.insertRule('@media all{.m' + (a % 8) + '{color:blue}}', 0);
      var r = s.cssRules[0];
      if (r && r.insertRule && r.cssRules && r.cssRules.length === 0) r.insertRule('.mi' + (b % 4) + '{margin:0}', 0);
      trimRules(s);
    }],
    // docs/67's deterministic crash: a @page rule inserted into a grouping rule whose parentStyleSheet was
    // cleared by deleteRule(0). Kept in the alphabet as the instrument's own sensitivity control.
    ['Rpage', 1, function (a) {
      var el = document.createElement('style');
      el.textContent = '@media all{}';
      document.head.appendChild(el);
      var s = el.sheet; if (!s) return;
      var g = s.cssRules[0];
      if (!g || !g.insertRule) { el.parentNode.removeChild(el); return; }

      g.insertRule('@page foo' + (a % 4) + ' {}', 0);

    }],
    ['Rnest-inline', 2, function (a, b) {
      var s = inlineSheet(); if (!s) return;
      var L = s.cssRules.length; if (!L) return;
      var r = s.cssRules[b % L];

    }],
    // docs/72's deterministic crash: nesting insertRule into a *copied* (<link>) sheet's CSSStyleRule.
    ['Rnest-link', 1, function (a, b) {
      var s = linkSheet(); if (!s) return;
      var L = s.cssRules.length; if (!L) return;
      var r = s.cssRules[b % L];
      if (r && r.insertRule) r.insertRule('& b{color:red}', 0);
    }],
    ['Rlinkplain', 2, function (a, b) {
      var s = linkSheet(); if (!s) return;
      var L = s.cssRules.length;
      s.insertRule('.lz' + (a % 10) + '{margin-top:' + (b % 9) + 'px}', b % (L + 1));
      trimRules(s);
    }],
    ['Rlinkdel', 2, function (a, b, c) {
      var s = linkSheet(); if (!s) return;
      var L = s.cssRules.length; if (!L) return;
      s.deleteRule(c % L);
    }],
    ['Rdetach', 2, function (a) {
      if (!s0) return;
      var p = s0.parentNode;
      if (p) p.removeChild(s0);
      var s = s0.sheet;
      if (s) { try { s.insertRule('.d' + (a % 5) + '{color:#000}', 0); } catch (e) {} trimRules(s); }
      if (p) p.appendChild(s0);
    }],

    // --- custom-element reactions (docs/80)
    ['Cdef', 2, function () {
      if (defs.length > 200) return;
      var n = 'x-fz' + (counter++);
      customElements.define(n, class extends HTMLElement {
        constructor() { super(); this.t = 1; }
        connectedCallback() { this.setAttribute('c', '1'); }
        attributeChangedCallback(k, o, v) { this.t = 2; }
        static get observedAttributes() { return ['a', 'c']; }

      defs.push(n);
    }],
    ['Cup', 3, function (a) {
      if (!defs.length) return;
      var el = document.createElement(defs[a % defs.length]);

      els.push(el); trimEls();
    }],
    ['Cupgrade', 2, function (a) {
      customElements.upgrade(root);
      if (defs.length) customElements.whenDefined(defs[a % defs.length]).then(noop, noop);
    }],
    ['Cattr', 2, function (a, b) {
      var el = pick(els, a);
      if (el) el.setAttribute('a', String(b % 9));
    }],

    // --- Range / Selection boundary churn (docs/68)
    ['Grange', 3, function (a) {
      var r = document.createRange();
      r.selectNodeContents(p0);
      r.deleteContents();
      p0.textContent = 'd' + (a % 9);
    }],
    ['Gsel', 2, function () {
      var s = getSelection(); if (!s) return;
      var r = document.createRange();
      r.selectNodeContents(p0);
      s.addRange(r);
      s.removeAllRanges();
    }],
    ['Gchurn', 2, function () {
      var r = document.createRange();
      for (var i = 0; i < 32; i++) {
        var t = document.createTextNode('t' + i);
        root.appendChild(t);
        r.setStart(t, 0); r.setEnd(t, 1);
        root.removeChild(t);
        r.setStart(p0, 0); r.setEnd(p0, p0.childNodes.length);
      }
    }],
    ['Gsurround', 1, function () {
      var r = document.createRange();
      r.selectNodeContents(p0);
      try { r.surroundContents(document.createElement('b')); } catch (e) {}
      r.compareBoundaryPoints(Range.START_TO_END, r);
    }],

    // --- the recalc trigger and a GC churn
    ['Llayout', 6, function () { STAT = document.body.offsetHeight; root.getBoundingClientRect(); }],
    ['Ltext', 2, function (a) {
      var t = p0.firstChild;
      if (t && t.nodeType === 3) t.data = 'd' + (a % 9);
      STAT = document.body.offsetHeight;
    }],
    ['Mchurn', 2, function () {
      for (var i = 0; i < 512; i++) junk.push({ x: i, s: 's' + i });
      if (junk.length > 8192) junk.length = 0;
    }]

  // ------------------------------------------------- the two ops this instrument adds (docs/85)
  // Fnew-good: a JS FontFace whose source resolves synchronously.  `local("NoSuchFontName")` (the
  // docs/84 op) can never open the window: the source fails before Success, so fontStateChanged
  // goes to Failure and rejects.  A resolvable local source reaches Status::Success, where
  // `m_loadedPromise->resolve(*this)` reads `then` on the FontFace — page script inside
  // iterateClients inside setStatus.
  OPS.push(['Fnew-good', 6, function (a) {
    var f = new FontFace(fam(a), 'local("DejaVu Sans")');
    document.fonts.add(f);
    try { f.loaded; } catch (e) {}        // materialise the promise: see Fdoc (docs/85 §3)
    f.load().then(noop, noop);

  // Fdoc: the docs/65 arming sequence, sampled.  A document @font-face with a resolvable local
  // source, laid out so the selector builds the face, its JS FontFace taken from document.fonts,
  // then load() — Success — resolve(*this) — the window — and the window's own layout frees it.
  // The window's action (the getter below) is what turns this into the CVE; on its own it is just
  // a document face being loaded.  Families are reused mod 8, so the sheet for a family is removed
  // before the new one is added and the face this op wants is the one still Status::unloaded —
  // without that, `forEach` hands back an older, already-loaded face and `load()` does nothing.
  OPS.push(['Fdoc', 6, function (a) {
    var n = 'zzD' + (a % 8);
    var old = docEls[n];
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var el = document.createElement('style');

    // load() on it is then a no-op with no window.  The docs/65 recipe needs the face Pending when
    // load() is called, so that pump() runs setStatus(Loading) -> (script) -> setStatus(Success).
    el.textContent = '@font-face{font-family:' + n + ';src:local("DejaVu Sans")}';
    document.head.appendChild(el);

    probe.push(el);
    document.body.offsetHeight;

    document.fonts.forEach(function (x) {
      if (String(x.family).indexOf(n) < 0) return;
      var st = '';
      try { st = x.status; } catch (e) {}
      if (st !== 'loaded') f = x;               // the fresh face, not a leftover from an older sheet
    });
    if (DBG) B('fdoc', 'n=' + n + '&found=' + (f ? 1 : 0) + '&probe=' + probe.length + '&fc=' + (function () { try { return document.fonts.size; } catch (e) { return -1; } })());
    if (f) {
      lastDoc = f;

      // Without this the window does not open inside setStatus at all: DOMPromiseProxy::resolve() only
      // stores the value when the page has never asked for the promise, and the fulfilment — the
      // `then` read, i.e. the script window — then happens later, at `m_loadedPromise.get()` inside
      // loadForBindings, i.e. AFTER `m_status = newStatus`.  Measured: the window's own `this.status`
      // reads "loaded" without this statement and "loading" with it (docs/85 §3).
      try { f.loaded; } catch (e) {}
      try { f.load().then(noop, noop); } catch (e) {}
      if (DBG) B('fdocpost', 'st=' + (function () { try { return f.status; } catch (e) { return 'threw'; } })());
    }

  // (a) Aanim — WebAnimation's promise frames.  docs/74 read 7 `resolve`-with-a-tail sites and
  // measured two by hand; this drives them from the alphabet.  Precondition, the same one docs/85 §3
  // found for FontFace: DOMPromiseProxy only settles the DeferredPromises that already exist, so
  // `ready`/`finished` must be materialised before the resolve or the C++ call creates no JS value
  // at all (docs/74's `pre=0` control).  play() before finish() puts a pending play task in flight,
  // which is what makes finish() take `m_readyPromise->resolve(*this)` (:873) as well as
  // finishNotificationSteps' `m_finishedPromise->resolve(*this)` (:1003) — two windows per call.
  OPS.push(['Aanim', 4, function (a, b) {
    var el = pick(els, a);
    if (!el || !el.isConnected) el = p0;
    var an = null;
    try { an = el.animate([{ opacity: 0.92 }, { opacity: 1 }], { duration: 40 + (b % 500) }); } catch (e) { return; }

    try { an.play(); } catch (e) {}                  // pending play task -> finish() resolves ready in-frame
    if (DBG && ANIMN < 6) { ANIMN++; B('anim', 'ctor=' + (an.constructor && an.constructor.name) +
      '&ps=' + an.playState + '&n=' + anims.length); }
    IN_AANIM++;
    try { an.finish(); } catch (e) { if (DBG && ANIMN < 8) B('animerr', 'e=' + (e && e.name)); }
    IN_AANIM--;
    if (DBG && ANIMN < 8) B('animpost', 'ps=' + an.playState + '&ath=' + athHits);

  // (b) Aframe — a SECOND Document, with its own CSSFontSelector and FontFaceSet.  Even draws create

  // frame's document from here (a font load inside the second document, synchronously in this task).
  // When ext=1 the inner window removes its own frame element: the Document that owns the resolving
  // face is detached inside the engine's setStatus frame.  docs/73 measured a frame tail by hand with
  // a same-document navigation; no run has done it with a font load in the window.

    // stays full of unreachable documents and the op silently stops creating new ones.

      if (!frames[k].isConnected) {

        // destruction (the inner context's own counter never reaches us — measured, docs/86 §2)

    for (var i = 0; i < frames.length; i++) { if (frames[i].q < seq) { fr = frames[i]; break; } }
    if (!fr) { if (frames.length < MAXFR) mkFrame(); return; }
