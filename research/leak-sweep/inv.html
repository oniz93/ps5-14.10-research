<!doctype html><html><head><meta charset="utf-8"><title>inv</title>
<script>
'use strict';
/* docs/95 part 9: where exactly does a view over a resizable ArrayBuffer part company with the
   spec? Matrix over {resizable in-bounds, resizable shrunk, resizable grown, plain} x a typed
   consumer (ImageData: Uint8ClampedArray conversion) and four union consumers (Blob, Response,
   TextDecoder, digest). Each cell reports the JS-visible byteLength next to the consumer result. */
var Q=[],PUMPING=false,SENT=0;
function send(e){ return new Promise(function(res){ var im=new Image(),d=false;
  function fin(){ if(d)return; d=true; res(); } im.onload=fin; im.onerror=fin;
  im.src='/ev?m='+encodeURIComponent(e); setTimeout(fin,250); }); }
function pump(){ if(PUMPING)return; PUMPING=true; (async function(){ while(Q.length){ await send(Q.shift()); SENT++; } PUMPING=false; })(); }
function add(k,v){ Q.push(k+'='+String(v).replace(/[\t\r\n]+/g,' ').slice(0,240)); pump(); }
window.onerror=function(m,s,l,c){ add('ONERROR',m+' @'+l); return false; };
new Image().src='/ev?m=BOOT+inv';

function mk(n,max,trunc){ var ab=new ArrayBuffer(n,{maxByteLength:max||n}); var v=new Uint8ClampedArray(ab);
  for(var i=0;i<n;i++) v[i]=(i*7+1)&0xff;
  if(trunc!==undefined) ab.resize(trunc);
  return {ab:ab,v:v}; }
function err(e){ return (e&&e.name)+': '+(e&&e.message)+' | '+(e&&e.stack?String(e.stack).split('\n')[0]:''); }

function cell(tag, o, w, h){
  var line = tag+' BL='+o.v.byteLength+' buf='+o.ab.byteLength+' max='+o.ab.maxByteLength;
  try { var id=new ImageData(o.v, w, h); line += ' | ImageData ok len='+id.data.length+' b0='+id.data[0]; }
  catch(e){ line += ' | ImageData '+err(e); }
  try { line += ' | Blob='+new Blob([o.v]).size; }
  catch(e){ line += ' | Blob '+err(e); }
  try { line += ' | TD='+new TextDecoder().decode(o.v).length; }
  catch(e){ line += ' | TD '+err(e); }
  add('c_'+tag, line);
  try {
    new Response(o.v).arrayBuffer().then(function(b){ add('resp_'+tag,'len='+b.byteLength); },
                                         function(e){ add('resp_'+tag,err(e)); });
  } catch(e){ add('resp_'+tag, err(e)); }
  try { add('u8_'+tag, 'copy='+new Uint8Array(o.v).length+' struct='+structuredClone(o.v).byteLength); }
  catch(e){ add('u8_'+tag, err(e)); }
}

var A = mk(64,64);          cell('in64', A, 4, 4);
var B = mk(1024,1024,16);   cell('shr16', B, 2, 2);
var C = mk(1024,1024,0);    cell('shr0', C, 2, 2);
var D = mk(16,64); D.ab.resize(64); cell('grown', D, 4, 4);
var E = mk(64,64);          E.v = new Uint8ClampedArray(64); cell('plain', E, 4, 4);

/* the same object through three aliases: does the *view* stay in bounds after a shrink? */
var F = mk(1024,1024);
var sub = F.v.subarray(0,64), map = F.v.map(function(x){return x;});
F.ab.resize(64);
try { add('alias_sub','BL='+sub.byteLength+' blob='+new Blob([sub]).size); } catch(e){ add('alias_sub',err(e)); }
try { add('alias_map','len='+map.length); } catch(e){ add('alias_map',err(e)); }

/* AudioBuffer.copyFromChannel takes a Float32Array (typed, not a union) */
try {
  var ac = new (window.AudioContext||window.webkitAudioContext)();
  var buf = ac.createBuffer(1, 16, 8000);
  var dst = new Float32Array(4);
  buf.copyFromChannel(dst, 0);
  add('au_copyfrom','ok dst='+Array.prototype.join.call(dst,',').slice(0,60));
  var srcAb = new ArrayBuffer(64,{maxByteLength:64}), srcV = new Float32Array(srcAb);
  srcAb.resize(0);
  try { buf.copyToChannel(srcV, 0); add('au_copyto','ok BL='+srcV.byteLength); } catch(e){ add('au_copyto',err(e)); }
  ac.close();
} catch(e){ add('au_copyfrom', err(e)); }

setTimeout(function(){ add('DONE','sent='+SENT); document.title='DONE'; }, 1500);
</script></head><body><p>inv</p></body></html>
